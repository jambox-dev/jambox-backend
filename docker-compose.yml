services:
  mongo:
    image: mongo:latest
    container_name: jambox-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - jambox-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jambox-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/jambox
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - mongo
    networks:
      - jambox-network

  frontend:
    build:
      context: ../jambox-front/jambox-front
      dockerfile: Dockerfile
    container_name: jambox-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - jambox-network

volumes:
  mongo-data:

networks:
  jambox-network:
    driver: bridge
