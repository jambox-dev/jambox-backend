spring:
    application:
        name: jambox-backend
    data:
        mongodb:
            port: 27017     # Standard MongoDB Port
            database:  # Ihr Datenbankname
            # Für URI-basierte Verbindung:
            uri:
            password:
            username:
            authentication-database:
    security:
        oauth2:
            client:
                registration:
                    spotify:
                        client-id:
                        client-secret:
                        authorization-grant-type: authorization_code
                        redirect-uri: "http://127.0.0.1:8080/login/oauth2/code/spotify"
                        scope: user-read-email
                        client-name: Spotify
                provider:
                    spotify:
                        authorization-uri: https://accounts.spotify.com/authorize
                        token-uri: https://accounts.spotify.com/api/token
                        user-info-uri: https://api.spotify.com/v1/me
                        user-name-attribute: id


jambox:
    oauth2-login-success-redirect: "http://127.0.0.1:4200/admin/dashboard"
    auth:
        authorized-emails:
            - ""
    spotify:
        email-address: ""
        callback-url: "http://127.0.0.1:8080/spotify/callback"